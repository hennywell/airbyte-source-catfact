[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
name = "source-catfact"
description = "Source implementation for Cat Fact API."
authors = ["Airbyte <contact@airbyte.io>"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/sources/catfact"
homepage = "https://docs.airbyte.com/integrations/sources/catfact"
repository = "https://github.com/airbytehq/airbyte"
packages = [
    { include = "source_catfact" },
]

[tool.poetry.dependencies]
python = "^3.9,<3.12"
airbyte-cdk = "^0.80.0"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2"
pytest-mock = "^3.6.1"
requests-mock = "^1.9.3"

[tool.poetry.scripts]
source-catfact = "source_catfact.run:run"

[tool.airbyte_cdk]
name = "source_catfact"
title = "Cat Fact Source"
description = "Source implementation for Cat Fact API."
version = "0.1.0"